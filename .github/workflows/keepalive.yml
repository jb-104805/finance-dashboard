name: Keep Actions alive

on:
  schedule:
    - cron: '0 12 1 * *'   # 1st of every month at noon UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file
        run: |
          date -u > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keep Actions scheduled workflows active [skip ci]"
          git push
